version: 2

models:
  - name: mart_customer_performance
    description: "Customer performance mart — aggregates customer rental and payment data."
    columns:
      - name: customer_id
        description: "Primary key for the customer."
        data_tests: [unique, not_null]
      - name: customer_name
        description: "Full name of the customer."
        data_tests: [not_null]
      - name: total_rentals
        description: "Total number of rentals made by the customer."
        data_tests: [not_null]
      - name: first_rented_at
        description: "Date of the customer's first rental."
        data_tests: [not_null]
      - name: last_rented_at
        description: "Date of the customer's most recent rental."
        data_tests: [not_null]
      - name: lifetime_payment_total
        description: "Total amount of money spent by the customer."
        data_tests: [not_null]
      - name: average_payment_value
        description: "Average payment value for the customer."
  
  - name: mart_daily_revenue
    description: "Daily revenue mart — aggregates daily rental and payment data."
    columns:
      - name: paid_date
        description: "Date of the payment."
        data_tests: [not_null]
      - name: store_id
        description: "Foreign key to the store where the payment was made."
        data_tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: total_payments
        description: "Total number of payments made on that date."
        data_tests: [not_null]
      - name: unique_customers
        description: "Total number of unique customers who made payments on that date."
        data_tests: [not_null]
      - name: total_revenue
        description: "Total revenue generated on that date."
        data_tests: [not_null]

  - name: mart_film_performance
    description: "Film performance mart — aggregates film rental and payment data."
    columns:
      - name: film_id
        description: "Primary key for the film."
        data_tests: [unique, not_null]
      - name: title
        description: "Title of the film."
        data_tests: [not_null]
      - name: category
        description: "Category of the film (e.g., Action, Comedy, Drama)."
        data_tests: [not_null]
      - name: rental_rate
        description: "Rate at which the film can be rented."
        data_tests: [not_null]
      - name: inventory_count
        description: "Number of copies of the film available for rent."
        data_tests: [not_null]
      - name: times_rented
        description: "Total number of times the film has been rented."
        data_tests: [not_null]
      - name: total_revenue
        description: "Total revenue generated by the film."
        data_tests: [not_null]