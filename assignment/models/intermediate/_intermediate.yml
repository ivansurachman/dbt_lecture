version: 2

models:
  - name: dim_customers
    description: "Customer dimension — identity, location, and lifetime value."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: customer_name
        description: "Full name of the customer."
        data_tests: [not_null]
      - name: total_rentals
        description: "Total number of rentals made by the customer."
        data_tests: [not_null]
      - name: first_rented_at
        description: "Date of the customer's first rental."
      - name: last_rented_at
        description: "Date of the customer's most recent rental."
      - name: lifetime_payment_total
        description: "Total amount of money spent by the customer."
        data_tests: [not_null]

  - name: dim_films
    description: "Film dimension — identity, category, and rating."
    columns:
      - name: film_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: title
        description: "Title of the film."
        data_tests: [not_null]
      - name: category
        description: "Category of the film (e.g., Action, Comedy, Drama)."
        data_tests: [not_null]
      - name: rating
        description: "MPAA rating of the film (e.g., G, PG, PG-13, R, NC-17)."
        data_tests: 
          - not_null
          - accepted_values:
              arguments: 
                - values: ['G', 'PG', 'PG-13', 'R', 'NC-17']
      - name: rating_description
        description: "Description of the MPAA rating."
        data_tests: [not_null]
      - name: rental_rate
        description: "Rate at which the film can be rented."
        data_tests: [not_null]
      - name: inventory_count
        description: "Number of copies of the film available for rent."
        data_tests: [not_null]
      - name: times_rented
        description: "Total number of times the film has been rented."
        data_tests: [not_null]
      - name: is_available
        description: "Boolean indicating if the film is currently available for rent."
        data_tests: [not_null]
      
  - name: fact_payments
    description: "Fact table capturing payment transactions."
    columns:
      - name: payment_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: paid_at
        description: "Date and time when the payment was made."
        data_tests: [not_null]
      - name: paid_date
        description: "Date when the payment was made (date part of `paid_at`)."
        data_tests: [not_null]
      - name: customer_id
        description: "Foreign key to the customer who made the payment."
        data_tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: customer_name
        description: "Full name of the customer who made the payment."
        data_tests: [not_null]
      - name: staff_id
        description: "Foreign key to the staff member who processed the payment."
        data_tests: [not_null]
      - name: store_id
        description: "Foreign key to the store where the payment was processed."
        data_tests: [not_null]
      - name: rental_id
        description: "Foreign key to the rental associated with the payment."
        data_tests: [not_null]
      - name: film_id
        description: "Foreign key to the film associated with the payment."
        data_tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('dim_films')
                field: film_id
      - name: amount
        description: "Amount of the payment."
        data_tests: [not_null]